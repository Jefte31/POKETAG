name: PokeTag Native Server CI

on:
  workflow_dispatch:
  push:
    branches: [ native-server-v1 ]
    paths:
      - 'native/**'
      - 'upstream/poketibia-sirninja/Servidor/Pokemon EX 2.0/Server Sources/**'
      - '.github/workflows/native-server-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'native/**'
      - 'upstream/poketibia-sirninja/Servidor/Pokemon EX 2.0/Server Sources/**'
      - '.github/workflows/native-server-ci.yml'

jobs:
  build-native-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install legacy TFS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config python3 \
            libxml2-dev libgmp-dev libboost-all-dev liblua5.1-0-dev \
            libsqlite3-dev

      - name: Build native server
        run: bash native/build-native.sh

      - name: Inspect binary
        run: |
          file .poketag-native-build/bin/theforgottenserver
          ldd .poketag-native-build/bin/theforgottenserver || true
