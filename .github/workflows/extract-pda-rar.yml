name: PokeTag Frankenstein integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inventory the three imported projects
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TOP LEVEL ==='
          find . -maxdepth 2 -mindepth 1 -type d | sort | head -200

          echo '=== PDA ARCHIVES / EXTRACTED ROOTS ==='
          find upstream/PDA-By-Slicer -maxdepth 3 -type d | sort | head -250

          echo '=== SERVER CONFIGS ==='
          find upstream -type f \( -iname 'config.lua' -o -iname 'config.lua.dist' \) -print | sort

          echo '=== MAPS / DATABASES ==='
          find upstream/PDA-By-Slicer upstream/poketibia-sirninja -type f \
            \( -iname '*.otbm' -o -iname '*.s3db' -o -iname '*.sqlite' -o -iname '*.sql' \) \
            -printf '%s %p\n' | sort -nr | head -120

          echo '=== PDA EXECUTABLES / CLIENT DATA ==='
          find upstream/PDA-By-Slicer -type f \
            \( -iname '*.exe' -o -iname '*.dat' -o -iname '*.spr' -o -iname '*.pic' \) \
            -printf '%s %p\n' | sort -nr | head -120

          echo '=== SERVER BUILD FILES ==='
          find upstream/poketibia-sirninja -maxdepth 4 -type f \
            \( -name 'Makefile*' -o -name 'CMakeLists.txt' -o -name 'configure*' -o -name 'autogen.sh' -o -name '*.vcxproj' \) \
            -print | sort | head -120

          echo '=== MODERN OTCLIENT BROWSER BUILD FILES ==='
          find upstream/otclient-opentibiabr -maxdepth 4 -type f \
            \( -name 'Dockerfile.browser*' -o -name 'CMakeLists.txt' -o -name 'init.lua' -o -iname '*emscripten*' \) \
            -print | sort | head -160

      - name: Inspect likely PDA 2.9 server configuration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t configs < <(find upstream/PDA-By-Slicer -type f -path '*Serv Full v2.9*' -iname 'config.lua' | sort)
          echo "PDA 2.9 config count: ${#configs[@]}"
          for cfg in "${configs[@]}"; do
            echo "=== $cfg ==="
            wc -c "$cfg"
            sed -n '1,220p' "$cfg" || true
          done

      - name: Basic repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test -d upstream/PDA-By-Slicer
          test -d upstream/poketibia-sirninja
          test -d upstream/otclient-opentibiabr
          echo 'All three project roots are present.'
